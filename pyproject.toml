[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opencaptions"
version = "0.1.0"
description = "Pipeline completo de geração de legendas e conversão TTML com ênfase."
readme = "README.md"
authors = [
    { name = "Fernanda Coutinho" }
]
requires-python = ">=3.9"
dependencies = [
    "openai-whisper",
    "ffmpeg-python",
    "torch",
    "tqdm"
]

[tool.setuptools.packages.find]
where = ["."]